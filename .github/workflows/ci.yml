# Generated by Google Gemini using example from https://lib.rs/crates/glua_check as base
name: GLua Check

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project code
        uses: actions/checkout@v4

      - name: Clone GMod Annotations Scraper
        uses: actions/checkout@v4
        with:
          repository: Pollux12/annotations-gmod-glua-ls
          path: annotations-gmod-glua-ls

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Installs Node.js for running the scraper
          cache: 'npm'
          cache-dependency-path: 'annotations-gmod-glua-ls/package.json'

      - name: Generate Annotations from Wiki
        run: |
          cd annotations-gmod-glua-ls
          npm install
          npm run scrape-wiki
          cd ..

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install glua_check
        run: cargo install glua_check

      - name: Run check with generated annotations
        run: glua_check --gmod-annotations ./annotations-gmod-glua-ls/output ./lua
